<style>
        .marker-highlight {
            position: relative;
            display: inline-block;
            z-index: 1;
        }
        .marker-highlight::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: -4px;
            right: -4px;
            height: 40%;
            background-color: #c2e8ff; /* primary-fixed */
            opacity: 0.6;
            z-index: -1;
            transform: skewX(-12deg);
            border-radius: 2px;
        }
    </style>

<nav class="flex items-center justify-between px-6 py-3 rounded-full border border-gray-200 shadow-sm bg-white/90 backdrop-blur-md w-fit mx-auto space-x-8 sticky top-6 z-50">

<h1 class="font-display-hero text-display-hero text-text-charcoal max-w-3xl leading-tight">
            Stay ahead with a <br/>
<span class="marker-highlight">safer</span> city route plan
        </h1>
<p class="font-body-lg text-body-lg text-text-muted mt-6 max-w-xl mx-auto">
            Visualize weather risk, traffic pressure, and emergency routes across Nasr City — faster and smarter.
        </p>
<div class="flex flex-row items-center justify-center space-x-4 mt-8">
<button class="bg-text-charcoal text-white px-6 py-3 rounded-lg font-body-md font-semibold hover:bg-black transition-colors shadow-sm">
